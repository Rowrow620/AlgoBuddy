version: 2
updates:
  # Enable weekly dependency updates for Rust (Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major"]

  # Enable weekly updates for GitHub Actions workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
